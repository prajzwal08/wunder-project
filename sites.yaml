        elevation_m: 39
        weather_station: {model: ATMOS 41, height_cm: 200}
        installed:
          - {depth: "5",  documented_cm: 5,  sensor: 5TM}
          - {depth: "10", documented_cm: 10, sensor: 5TM}
          - {depth: "20", documented_cm: 20, sensor: 5TM}
          - {depth: "40", documented_cm: 40, sensor: 5TM}
          - {depth: "80", documented_cm: 80, sensor: 5TM}
